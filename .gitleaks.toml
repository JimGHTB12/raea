# gitleaks: the default rules, minus raea's asset ledgers, whose "key" field is a content hash of the made file
# (prompt, seed and model), not a credential; and Bevy's batching code, whose `prev_key = item.sort_key.0` is a
# render-phase sort key.
[extend]
useDefault = true

[allowlist]
description = "asset ledgers and Bevy sort keys"
paths = ['''(^|/)assets/made\.jsonl$''']
regexTarget = "line"
regexes = ['''prev_key = item\.sort_key''']
