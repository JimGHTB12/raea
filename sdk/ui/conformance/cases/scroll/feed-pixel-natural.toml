area = "scroll"
title = "a pixel wheel (natural scrolling on) scrolls the feed by at least the distance the device moved"
window = [1440, 900]

[[steps]]
wait = { id = "feed", field = "scroll.max", gt = 240 }
[[steps]]
input = { type = "move", at = "card-*" }
[[steps]]
input = { type = "wheel", at = "feed", dy = -240, unit = "pixel", natural = true, phase = "changed" }
[[steps]]
expect = { id = "feed", field = "scroll.top", increased_by = 240 }
