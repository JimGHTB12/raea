area = "pointer"
title = "a press on a feed row in the sidebar makes that row the current one and no other"
window = [1440, 900]

[[steps]]
wait = { id = "feed-f-ides-dailies", visible = true }
[[steps]]
expect = { all = [{ id = "feed-f-ides-all", current = true }, { id = "feed-f-*", current = true, count = 1 }] }
[[steps]]
input = { type = "click", at = "feed-f-ides-dailies" }
[[steps]]
expect = { all = [{ id = "feed-f-ides-dailies", current = true }, { id = "feed-f-*", current = true, count = 1 }] }
