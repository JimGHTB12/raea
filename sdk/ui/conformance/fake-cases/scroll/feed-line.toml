area = "scroll"
title = "a line wheel scrolls the feed at least 32 pt a line"
space = "feed"
window = [1440, 900]

[[steps]]
wait = { id = "feed.list", field = "scroll.max", gt = 96 }
[[steps]]
input = { type = "move", at = "feed.list" }
[[steps]]
input = { type = "wheel", at = "feed.list", dy = -3, unit = "line", natural = false }
[[steps]]
expect = { id = "feed.list", field = "scroll.top", increased_by = 96 }
