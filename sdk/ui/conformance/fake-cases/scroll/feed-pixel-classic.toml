area = "scroll"
title = "a pixel wheel with natural scrolling off scrolls the feed the same way for the same delta (macOS has applied the setting already)"
space = "feed"
window = [1440, 900]

[[steps]]
wait = { id = "feed.list", field = "scroll.max", gt = 240 }
[[steps]]
input = { type = "move", at = "feed.list" }
[[steps]]
input = { type = "wheel", at = "feed.list", dy = -240, unit = "pixel", natural = false }
[[steps]]
expect = { id = "feed.list", field = "scroll.top", increased_by = 240 }
