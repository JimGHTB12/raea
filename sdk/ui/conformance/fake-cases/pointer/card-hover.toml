area = "pointer"
title = "a card under the pointer is hovered, and stops being hovered when the pointer leaves it"
space = "feed"
window = [1440, 900]

[[steps]]
wait = { id = "feed.card.0", visible = true }
[[steps]]
input = { type = "move", at = "feed.card.0" }
[[steps]]
expect = { all = [{ id = "feed.card.0", hovered = true }, { id = "feed.card.*", hovered = true, count = 1 }] }
[[steps]]
input = { type = "move", at = "feed.search" }
[[steps]]
expect = { id = "feed.card.*", hovered = true, count = 0 }
