area = "text"
title = "a press in chat.composer focuses it and fifty fast keys all land"
space = "feed"
window = [1440, 900]

[[steps]]
if = { id = "chat", visible = false }
input = { type = "click", at = "header.toggle.chat" }
[[steps]]
wait = { id = "chat.composer", visible = true }
[[steps]]
input = { type = "click", at = "chat.composer" }
[[steps]]
input = { type = "keys", text = "the quick brown fox jumps over the lazy dog 0123" }
[[steps]]
expect = { all = [{ id = "chat.composer", focused = true }, { id = "chat.composer", value = "the quick brown fox jumps over the lazy dog 0123" }] }
hold = 10
