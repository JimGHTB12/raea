[package]
name = "raea-runtime-edit"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Text geometry and the selection's paint on a Blitz page, for sdk/ui's Range, Selection and contenteditable: text.rects, caret.at, selection.set"

[dependencies]
raea-runtime-dom = { path = "../dom" }
raea-runtime-js = { path = "../js" }
raea-sys-page = { path = "../../systems/page" }
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
# the inline layout's cursors and selections, for Range rects and the caret
parley = { version = "0.12", default-features = false, features = ["std"] }
serde_json = "1"
