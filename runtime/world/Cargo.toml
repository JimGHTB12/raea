[package]
name = "raea-runtime-world"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A composition's frames read into worlds of facts (docs/direction.feature DR1): React stepped with nothing drawn, its 3D, its page laid out and its timeline as entities with components"

[dependencies]
raea-core-facts = { path = "../../core/facts" }
raea-core-scene = { path = "../../core/scene" }
raea-runtime-scene = { path = "../scene" }
raea-runtime-react = { path = "../react", default-features = false }
raea-runtime-bake = { path = "../bake" }
raea-runtime-bundle = { path = "../bundle" }
# the page laid out with nothing drawn (BevyPage::lay_out), its text and boxes read as a render's manifest reads them
raea-runtime-page = { path = "../page" }
raea-sys-layers = { path = "../../systems/layers" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app"] }
serde_json = "1"
# a clip's file's identity (its SHA-256, as raea's asset store names files)
sha2 = "0.10"
