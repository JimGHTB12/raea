[package]
name = "raea-runtime-plugins"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Bevy plugins inside raea's engine: compiled in by a crate that registers them, driven by generic rows through Bevy's TypeRegistry, stepped by the frame index"

[dependencies]
raea-sys-frame = { path = "../../systems/frame" }
raea-sys-material = { path = "../../systems/material" }
# three.js's shaders (docs/r3f.feature R3F11): a `three:uniforms` row patches a part's uniforms
raea-sys-three-shader = { path = "../../systems/three-shader" }
raea-sys-shader = { path = "../../systems/shader" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "bevy_state"] }
serde = "1"
raea-core-shape = { path = "../../core/shape" }
raea-bevy-world = { path = "../../engine/bevy-world" }
serde_json = "1"
