[package]
name = "raea-runtime-bake"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A timeline baked: a composition's React commits recorded frame by frame, replayed with no JavaScript running"

[features]
# the bundle's functions found by swc (raea-modules), so an incremental bake steps only what changed; an exported
# game's player goes without and steps every frame
modules = ["dep:raea-modules"]

[dependencies]
raea-io-home = { path = "../../io/home" }
raea-runtime-react = { path = "../../runtime/react", default-features = false }
raea-runtime-bundle = { path = "../bundle" }
raea-modules = { path = "../../engine/modules", optional = true }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app"] }
serde_json = "1"
