[package]
name = "raea-runtime-bundle-lib"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea-bundle's library (engine/bundle: Rolldown) loaded at run time: an entry in, its script and CSS out"

[dependencies]
# never a Cargo dependency on raea-bundle itself: Rolldown's crates turn on serde_json's preserve_order and
# arbitrary_precision, and features unify across a binary (f60e0b7)
libloading = "0.8"
# paths without Windows' verbatim \\?\ prefix, which Rolldown's resolver can't open (T1f)
raea-io-home = { path = "../../../io/home" }
serde_json = "1"
