[package]
name = "raea-runtime-shared"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "State React and the World share: resources and components watched, observed and written by reflection, and the outbox to React"

[dependencies]
raea-native = { path = "../../engine/native", default-features = false }
raea-bevy-world = { path = "../../engine/bevy-world" }
raea-runtime-twins = { path = "../twins" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app"] }
serde_json = "1"
