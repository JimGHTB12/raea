[package]
name = "raea-runtime-gpuframe"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A frame composited on the GPU: clips as NV12 planes in a pooled byte budget, the Blitz overlay over the camera's target, and the NV12 readback for the encoder"

[dependencies]
raea-sys-frame = { path = "../../systems/frame", features = ["native"] }
raea-runtime-view = { path = "../view" }
raea-core-program = { path = "../../core/program" }
raea-core-k = { path = "../../core/k" }
raea-sys-k = { path = "../../systems/k" }
raea-gpu-device = { path = "../../gpu/device" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "ui_bevy_render"] }
wgpu = "=30.0.1"
bytemuck = "1"
serde_json = "1"
