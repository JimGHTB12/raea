[package]
name = "raea-runtime-view"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The direct render's views (GPU and CPU) without the Bevy frame loop, the 2D rows drawn by Blitz, clips' masks, and the paint device as Bevy's renderer"

[dependencies]
raea-core-program = { path = "../../core/program" }
raea-core-shape = { path = "../../core/shape" }
raea-core-wire = { path = "../../core/wire" }
raea-core-k = { path = "../../core/k" }
raea-sys-k = { path = "../../systems/k" }
raea-sys-frame = { path = "../../systems/frame", features = ["native"] }
raea-gpu-device = { path = "../../gpu/device" }
raea-io-media = { path = "../../io/media", default-features = false, features = ["soft-audio", "apple"] }
raea-page = { path = "../../engine/page" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "ui_bevy_render"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
wgpu = "=30.0.1"
bytemuck = "1"
serde_json = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-metal"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLTexture", "MTLPixelFormat", "MTLDevice", "MTLResource", "MTLAllocation"] }
