[package]
name = "raea-runtime-js"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "TypeScript running natively in a Bevy app under raea's Blitz page: the JS engines (JavaScriptCore on Apple, QuickJS elsewhere), the op wire, native calls, the World API, and the page's media, canvas, 3D view and accessibility pieces"

[lib]
name = "raea_runtime_js"

[features]
default = ["media"]
# the portable engine (QuickJS) on Apple too, in place of JavaScriptCore: how the portable path is tested on a Mac
portable = ["raea-runtime-jsengine/portable"]
# media (docs/ts-native.feature P15): video and sound through raea-io-media
media = ["dep:raea-io-media"]

[dependencies]
# images
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "bevy_render", "bevy_image"] }
# the op wire to and from a page's script
raea-core-wire = { path = "../../core/wire" }
raea-io-net = { path = "../../io/net", features = ["ws"] }
# the world API: BRP's methods run in-process, watched reads (shared with every raea runtime)
raea-bevy-world = { path = "../../engine/bevy-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the JS engine (JavaScriptCore on Apple, QuickJS elsewhere)
raea-runtime-jsengine = { path = "../jsengine" }
# video and audio elements' sources decoded (src/media_html.rs): the app's backends, else the ffmpeg CLI's
raea-io-media = { path = "../../io/media", default-features = false, optional = true }
# webaudio's samples across the wire
base64 = "0.22"

