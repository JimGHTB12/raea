[package]
name = "raea-sys-grid"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Greybox surfaces: the standard material with world-space graph paper and face outlines over it"

[dependencies]
raea-sys-frame = { path = "../frame" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
raea-sys-fog = { path = "../fog" }
