[package]
name = "raea-sys-a11y"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A page's accessibility tree as Chrome builds it (roles, names, states), in AccessKit and read back as the records the parity harness compares"

[dependencies]
# the tree, AccessKit as bevy_a11y 0.20 has it, read back through its consumer
accesskit = { version = "=0.24.1", default-features = false }
accesskit_consumer = { version = "=0.38.0", default-features = false }
serde_json = "1"
