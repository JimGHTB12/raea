[package]
name = "raea-sys-grass"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A field of grass from a few grids (the ground's height, clumps per square metre, colour patches, size): blades made by the engine in tiles, each tile as detailed as its distance from the camera asks, swayed by the paint look's wind"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_pbr"] }
# a grass row's values
raea-core-program = { path = "../../core/program" }
raea-sys-frame = { path = "../frame" }
# the row's `grass` spec, as the SDK sends it
serde_json = "1"
