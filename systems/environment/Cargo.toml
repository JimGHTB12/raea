[package]
name = "raea-sys-environment"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "An <Environment>: equirectangular panoramas made into cubemaps, lighting the scene through Bevy's environment-map filter and drawn as its sky"

[dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
raea-sys-frame = { path = "../frame" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "bevy_solari"] }
