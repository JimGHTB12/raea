[package]
name = "raea-sys-page-net"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A page's loads: files beside it and under RAEA_PAGE_ROOT, data URLs and raea's cache (FileNet), an iframe's (FrameNet), the page's same-origin fetch, and Blitz's image decoder (raea-sys-page's net)"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_log"] }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
raea-io-net = { path = "../../io/net" }
raea-sys-image = { path = "../image" }
serde_json = "1"
base64 = "0.22"
url = "2"
