[package]
name = "raea-sys-speech"
version = "0.1.0"
edition = "2024"
publish = false
description = "Speech on raea's ONNX facility: Pocket TTS streamed sentence by sentence, its word clock, and the speech service games and renders use"
license = "FSL-1.1-ALv2"

[dependencies]
raea-sys-ml = { path = "../ml" }
ort = { version = "=2.0.0-rc.13", features = ["half"] }
anyhow = "1"
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
