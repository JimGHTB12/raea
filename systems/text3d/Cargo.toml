[package]
name = "raea-sys-text3d"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Text in the 3D world (<RichText>): every glyph a lit, shaded entity, laid out by cosmic-text"

[features]
# raea's bundled faces (core/fonts); without them the system's fonts
native = ["dep:raea-core-fonts"]

[dependencies]
raea-sys-frame = { path = "../frame" }
raea-core-program = { path = "../../core/program" }
raea-core-fonts = { path = "../../core/fonts", optional = true }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
bevy_rich_text3d = { version = "=0.8.0", default-features = false, features = ["reflect"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std"] }
serde_json = "1"
