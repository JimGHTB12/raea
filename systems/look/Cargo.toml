[package]
name = "raea-sys-look"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Looks: a model drawn as pixel art or the site's grain (a cell a texel, laid back over the frame), the frame's look, and the paint look's surfaces"

[dependencies]
raea-sys-frame = { path = "../frame" }
raea-sys-compose = { path = "../compose" }
raea-sys-post = { path = "../post" }
raea-sys-fog = { path = "../fog" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
serde_json = "1"
