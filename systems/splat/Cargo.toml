[package]
name = "raea-sys-splat"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Gaussian splats (<Splat>): .ply, .splat and .spz clouds drawn as sorted screen-space ellipses, their order and effects a function of the frame"

[features]
# .spz files, gunzipped by the system's gzip (a native build only)
native = []

[dependencies]
raea-sys-frame = { path = "../frame" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
serde_json = "1"
