[package]
name = "raea-sys-k"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "K kernels on the GPU: compiled to fused WGSL compute shaders and run on wgpu, matching raea-core-k's interpreter bit for bit"

[dependencies]
wgpu = "=30.0.1"
pollster = "0.4"
bytemuck = "1"
serde_json = "1"
raea-core-k = { path = "../../core/k" }
raea-gpu-device = { path = "../../gpu/device" }
