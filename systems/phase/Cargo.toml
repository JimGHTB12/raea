[package]
name = "raea-sys-phase"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Your own draw in a camera's phase (docs/control.feature FC2d): a pipeline of your shader file as written, drawing your vertex and index buffers in Opaque3d, as Bevy's custom_phase_item queues one"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
bytemuck = "1"
raea-sys-shader = { path = "../shader" }
