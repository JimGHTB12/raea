[package]
name = "raea-sys-shader-wgsl"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A WGSL source read as text: own uniform structs' layout, storage buffers' words, and bindings renumbered into raea's slots (raea-sys-shader builds on it)"

[dependencies]
raea-sys-material = { path = "../../material" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
serde_json = "1"
