[package]
name = "raea-sys-shader"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Shaders written in TypeScript over the lit standard surface (docs/shaders.feature SH1-SH4): ExtendedMaterial<StandardMaterial, ShaderExt>, its fragment shader chosen per material from the source's hash"

[dependencies]
raea-sys-material = { path = "../material" }
raea-sys-sampler = { path = "../sampler" }
raea-sys-shader-wgsl = { path = "wgsl" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "bevy_ui", "bevy_ui_render"] }
wgpu = "=30.0.1"
serde_json = "1"
