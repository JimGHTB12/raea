[package]
name = "raea-sys-volume"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Simulated volumes (<Smoke>, <Cloud>, <Contrail>): a fluid on a grid, raymarched, lit and casting shadows, a function of the frame"

[dependencies]
raea-sys-frame = { path = "../frame" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
serde_json = "1"
