[package]
name = "raea-sys-screen"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Live pictures on surfaces (<Screen>, a model's screen materials, flat panels), drawn as CRTs or flat, and the screen under a point"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
raea-sys-frame = { path = "../frame" }
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
wgpu = "=30.0.1"
serde_json = "1"
