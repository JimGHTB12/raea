[package]
name = "raea-sys-mesh"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A row's mesh from JSON: one of Bevy's primitives by name (rings and extrusions too), meshed by Bevy's own meshers, or a buffer mesh's own vertex buffers"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
serde_json = "1"
raea-core-shape = { path = "../../core/shape" }
