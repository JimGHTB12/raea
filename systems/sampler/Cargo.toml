[package]
name = "raea-sys-sampler"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "How a texture is read, given from TypeScript (docs/shaders.feature SH5): filter, mipmaps, wrap and anisotropy over a texture's default, set on images that load from files once they have"

[dependencies]
raea-core-program = { path = "../../core/program" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render"] }
serde_json = "1"
