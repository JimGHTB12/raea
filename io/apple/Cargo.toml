[package]
name = "raea-io-apple"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea's media backend on Apple hardware: AVFoundation and VideoToolbox decode (HEVC, H.264) and encode (H.264, HEVC, AAC)"

[dependencies]
raea-io-codec = { path = "../codec", features = ["mux"] }
raea-io-soft = { path = "../soft" }
raea-io-apple-coding = { path = "../apple-coding" }
# decode errors and slow seeks in the run's trace
raea-io-trace = { path = "../trace" }
serde_json = "1"
muxide = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-graphics", "block2"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-video-toolbox = "0.3"
block2 = "0.6"
