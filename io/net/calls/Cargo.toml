[package]
name = "raea-io-net-calls"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The net.* host calls (fetch, WebSockets, storage) both app targets answer: Bevy-free, keyed by the calling root"

[dependencies]
# the network under them, and the wire's host event a socket's news comes back as
raea-io-net = { path = "..", features = ["ws"] }
raea-core-wire = { path = "../../../core/wire" }
serde_json = "1"
# serve.rs: T2b's recorded calls and the local servers they're made against, for each target's test
tungstenite = { version = "0.30", optional = true }

[features]
serve = ["dep:tungstenite"]
