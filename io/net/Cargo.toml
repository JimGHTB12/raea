[package]
name = "raea-io-net"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "What a URL names, read: data: URLs, HTTP(S) requests, WebSockets, raea's URL cache"

[features]
# ws.rs: a page's WebSockets (the net.ws host calls); raea-native's shell fetches only
ws = ["dep:tungstenite"]

[dependencies]
raea-io-home = { path = "../../io/home" }
serde_json = "1"
base64 = "0.22"
ureq = "2"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
