[package]
name = "raea-io-trace"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea's flight recorder: a session folder per run that outlives a crash"

[dependencies]
raea-io-home = { path = "../../io/home" }
serde_json = "1"
log = "0.4"
libc = "0.2"

# whether an earlier session's process still runs, on Windows (crash.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
