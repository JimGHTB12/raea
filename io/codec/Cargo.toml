[package]
name = "raea-io-codec"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea's media seam: decoders, encoders and backends as traits, frames, audio as columns, YUV, resampling, loudness and pure-Rust muxing"

[features]
# muxing elementary streams into MP4 (remux.rs)
mux = ["dep:muxide", "dep:re_mp4"]

[dependencies]
raea-io-home = { path = "../../io/home" }
serde = { version = "1", features = ["derive"] }
muxide = { version = "0.2", optional = true }
re_mp4 = { version = "0.5", optional = true }

# the optimized-copy index: the cache folder's free space (statvfs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
# SurfaceFrame: a decoded frame left in its CVPixelBuffer
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
