# RR0's iPhone bench app (bench/rerender/ios/bench.sh): xcodegen makes RerenderBench.xcodeproj from this. The Rust side
# is libraea_rerender_ios.a (bench/rerender/ios, built for aarch64-apple-ios); Bundle/ holds the shot bundles bench.sh
# makes. Signed with the App Store Connect key, as apps/ipad is: team BJJZ79J5NL, automatic.
name: RerenderBench
options:
  bundleIdPrefix: io.raea
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: BJJZ79J5NL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ENABLE_BITCODE: NO
targets:
  RerenderBench:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Bundle
        type: folder
        buildPhase: resources
    # shot 2 (five shadowed volumetric lamps) is killed at the default per-app memory limit; shots 3-5 peak at 2.4-2.8 GB
    entitlements:
      path: Sources/RerenderBench.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.raea.rerenderbench
        SWIFT_OBJC_BRIDGING_HEADER: Sources/bench.h
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -lraea_rerender_ios -lc++ -lz -liconv -lresolv -framework Metal -framework MetalKit -framework QuartzCore -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox -framework CoreText -framework CoreGraphics -framework CoreFoundation -framework Security -framework IOSurface -framework AudioToolbox -framework CoreImage -framework ImageIO -framework AVFAudio -framework MediaToolbox -framework CoreAudio -framework SystemConfiguration -framework UIKit -framework JavaScriptCore -framework GameController -framework CoreHaptics
        INFOPLIST_KEY_CFBundleDisplayName: Rerender Bench
        DEAD_CODE_STRIPPING: YES
        # no dSYM: dsymutil on the 285 MB binary takes minutes, and a bench app's crashes are read from its log
        DEBUG_INFORMATION_FORMAT: dwarf
