[package]
name = "raea-bridge-bench"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The Blitz-Bevy bridge's bench (run.sh): its examples, each a Bevy program that checks one of the bridge's claims (B3 H1-H11)"

[dev-dependencies]
raea-io-home = { path = "../../io/home" }
raea-runtime-react = { path = "../../runtime/react" }
raea-runtime-page = { path = "../../runtime/page" }
raea-runtime-dom = { path = "../../runtime/dom" }
raea-runtime-twins = { path = "../../runtime/twins" }
raea-runtime-input = { path = "../../runtime/input" }
raea-render = { path = "../../engine/render", default-features = false, features = ["native"] }
raea-page = { path = "../../engine/page" }
raea-sys-page = { path = "../../systems/page" }
raea-sys-fonts = { path = "../../systems/fonts" }
raea-sys-image = { path = "../../systems/image" }
raea-core-wire = { path = "../../core/wire" }
raea-runtime-js = { path = "../../runtime/js" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
serde_json = "1"
# plain_page --window: a window of its own, handed to Bevy by its raw handles (no bevy_winit, so bevy builds as before)
winit = "=0.30.13"
# the counting allocator (twin_cost: a frame's allocations)
raea-core-alloc = { path = "../../core/alloc" }
