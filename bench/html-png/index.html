<!doctype html>
<!-- #32: an HTML page to PNGs. Nothing on the canvas but a red box at half opacity sliding right over 30 frames.
     bench/html-png/check.sh -->
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>html,body{margin:0;width:320px;height:180px}#box{position:absolute;left:40px;top:40px;width:100px;height:100px;background:#ff0000;opacity:.5}</style>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="320" data-height="180" data-duration="1">
<div id="box"></div>
</div>
<script>
window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true});
tl.to('#box',{x:120,duration:1,ease:'none'},0);
window.__timelines.main=tl;
</script></body></html>
