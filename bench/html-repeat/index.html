<!doctype html>
<!-- #20: a rounded panel with three children scaling 1 -> 1.014 and back (GSAP). Its frames came out a level apart on
     some renders, as a tile's coverage was summed in the order its segments arrived. bench/html-repeat/check.sh -->
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0a0b;color:#f4f4f5;font-family:sans-serif}
#root{position:relative;width:100%;height:100%;overflow:hidden}
#panel{position:absolute;left:120px;bottom:205px;width:760px;height:118px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#121214;display:flex;align-items:center;padding:0 34px;gap:24px}
#check{width:42px;height:42px;border-radius:50%;border:2px solid #ffb517;color:#ffb517;display:grid;place-items:center;font-size:26px;line-height:1}
#label{font-size:30px;letter-spacing:-.015em}
#stamp{margin-left:auto;font:500 13px/1 monospace;letter-spacing:.08em;text-transform:uppercase;color:#ffb517}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="9">
<div id="panel"><div id="check">+</div><div id="label">Headline</div><div id="stamp">Button</div></div>
</div><script>
window.__timelines=window.__timelines||{};
var tl=gsap.timeline({paused:true}),drift={p:0};
gsap.set('#panel',{opacity:0});
tl.fromTo('#panel',{opacity:0,y:28},{opacity:1,y:0,duration:.8,ease:'power3.out'},2.2);
tl.to(drift,{p:1,duration:9.5,ease:'none'},0);
tl.to('#panel',{scale:1.014,duration:2.2,ease:'sine.inOut',yoyo:true,repeat:1},5.2);
window.__timelines.main=tl;
</script></body></html>
