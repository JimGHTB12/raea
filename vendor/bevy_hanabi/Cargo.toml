# raea: bevy_hanabi from git (djeedai/bevy_hanabi@77630ff1eed8b104f34e91d23e9440428dc5ab01), its src/ byte for byte but for
# the changes marked "raea:" (frame-pure particles, raea #52). Cargo.toml.orig is upstream's manifest; this one drops its
# examples, GPU tests, dev-dependencies and [workspace], whose files aren't carried.
[package]
name = "bevy_hanabi"
version = "0.20.0-dev"
authors = ["Jerome Humbert <djeedai@gmail.com>"]
edition = "2021"
rust-version = "1.97.1"
description = "Hanabi GPU particle system for the Bevy game engine"
repository = "https://github.com/djeedai/bevy_hanabi"
homepage = "https://github.com/djeedai/bevy_hanabi"
documentation = "https://docs.rs/bevy_hanabi"
keywords = ["bevy", "particle-system", "particles", "vfx"]
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = [
  "docs/*.svg",
  "docs/*.png",
  "examples/*.gif",
  "examples/*.png",
  "examples/wasm/*",
  ".github",
  "release.md",
  "build_examples_wasm.bat",
  "build_examples_wasm.sh",
  "run_examples.bat",
  "run_examples.sh",
  "deny.toml",
  "rustfmt.toml.nightly",
]
autoexamples = false

[features]
default = ["2d", "3d", "gpu_tests"]

# Enable support for rendering through a 2D camera (Camera2d).
# You need to activate either the 2d or 3d feature at least (or both).
2d = []

# Enable support for rendering through a 3D camera (Camera3d).
# You need to activate either the 2d or 3d feature at least (or both).
3d = []

# Enable tracing annotations. This is disabled by default for performance.
trace = []

# Special feature to enable GPU-based tests, which otherwise fail
# on a CI machine without a graphic adapter or without proper drivers.
# This is a testing-only feature, which has no effect on the build.
gpu_tests = []

[dependencies]
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
fixedbitset = "0.5"
rand = "0.10"
rand_pcg = "0.10"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
ron = "0.12"
bitflags = "2.3"
thiserror = "2"
# Same versions as Bevy 0.20 (bevy_render)
wgpu = { version = "30", default-features = false, features = [
  "wgsl",
  "dx12",
  "metal",
  "vulkan",
  "fragile-send-sync-non-atomic-wasm",
] }

# getrandom requires both 'wasm_js' as a feature AND as a RUSTFLAGS to work on wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = [
  "wasm_js",
] }

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_asset",
  "bevy_log",
  "x11",
]

[package.metadata.docs.rs]
all-features = true

