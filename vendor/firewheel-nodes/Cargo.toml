[package]
edition = "2024"
name = "firewheel-nodes"
version = "0.12.2"
authors = ["Billy Messenger <billydm@noreply.codeberg.org>"]
build = false
exclude = ["assets/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Official factory nodes for the Firewheel audio engine"
homepage = "https://github.com/BillyDM/firewheel/blob/main/crates/firewheel-nodes"
readme = false
keywords = [
    "game",
    "audio",
    "graph",
]
categories = [
    "game-development",
    "multimedia::audio",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/BillyDM/firewheel"

[package.metadata.docs.rs]
all-features = true

[features]
all_nodes = [
    "beep_test",
    "peak_meter",
    "sampler",
    "spatial_basic",
    "fast_filters",
    "svf",
    "noise_generators",
    "delay_compensation",
    "mix",
    "freeverb",
    "convolution",
    "fast_rms",
    "triple_buffer",
]
all_nodes_no_std = [
    "beep_test",
    "peak_meter",
    "sampler",
    "spatial_basic",
    "fast_filters",
    "svf",
    "noise_generators",
    "delay_compensation",
    "mix",
    "freeverb",
    "fast_rms",
    "triple_buffer",
]
beep_test = []
bevy = [
    "dep:bevy_ecs",
    "firewheel-core/bevy",
]
bevy_reflect = [
    "dep:bevy_reflect",
    "firewheel-core/bevy_reflect",
]
convolution = ["dep:fft-convolver"]
default = ["std"]
delay_compensation = ["dep:smallvec"]
fast_filters = []
fast_rms = []
freeverb = []
libm = [
    "firewheel-core/libm",
    "num-traits/libm",
]
mix = []
noise_generators = []
peak_meter = []
sampler = [
    "dep:smallvec",
    "dep:triple_buffer",
]
scheduled_events = ["firewheel-core/scheduled_events"]
serde = [
    "dep:serde",
    "firewheel-core/serde",
]
spatial_basic = []
std = [
    "bevy_ecs?/std",
    "bevy_platform/std",
    "bevy_reflect?/std",
    "num-traits/std",
    "firewheel-core/std",
]
svf = []
triple_buffer = ["dep:triple_buffer"]

[lib]
name = "firewheel_nodes"
path = "src/lib.rs"

# raea: Bevy 0.19 -> 0.20
[dependencies.bevy_ecs]
version = "0.20.0"
optional = true
default-features = false

# raea: Bevy 0.19 -> 0.20
[dependencies.bevy_platform]
version = "0.20.0"
features = ["alloc"]
default-features = false

# raea: Bevy 0.19 -> 0.20
[dependencies.bevy_reflect]
version = "0.20.0"
optional = true
default-features = false

[dependencies.fft-convolver]
version = "0.4.0"
optional = true

[dependencies.firewheel-core]
version = "0.12.0"
default-features = false

[dependencies.fixed-resample]
version = "0.12.0"
features = [
    "fft-resampler",
    "channel",
]
optional = true
default-features = false

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.smallvec]
version = "1"
optional = true

[dependencies.thiserror]
version = "2"
default-features = false

[dependencies.triple_buffer]
version = "9"
optional = true
