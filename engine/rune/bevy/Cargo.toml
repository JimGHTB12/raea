# A Rune tree drawn into a Bevy Image on Bevy's own device (docs/targets.feature T6c-e, from T6b's spike). Bevy 0.20.0
# and wgpu 30.0.1 as the rest of raea has them: one wgpu for Rune and Bevy (R0b, tools/one-version.sh).
[package]
name = "raea-rune-bevy"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A Rune tree as a Bevy layer: drawn into a Bevy Image on Bevy's device with no copy, pointer and keys forwarded to it"

[dependencies]
rune.workspace = true
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "bevy_window", "bevy_asset", "bevy_image", "bevy_render", "bevy_core_pipeline"] }
wgpu = "=30.0.1"

[dev-dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "bevy_window", "bevy_asset", "bevy_image", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_camera"] }
