[package]
name = "raea-bevy-world"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The one in-process Bevy Remote Protocol layer every raea runtime shares (docs/bevy-ts.feature G16): a method run on a World (the App's bevy_remote table when it has one, plugin methods included, else BRP's built-in handlers), entities named as the host knows them, watched reads, and the queue a live game's TypeScript calls through"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_state"] }
bevy_remote = { version = "=0.20.0", default-features = false }
raea-core-calls = { path = "../../core/calls" }
serde = "1"
serde_json = "1"
