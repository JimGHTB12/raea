[package]
name = "raea-bevy-plugins"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "Bevy plugins compiled into raea's engine, each behind a feature (sdk/raea/docs/bevy-plugins.md): declared in a project's package.json, resolved here by tools/bevy-plugins.sh, registered with raea-render's plugin hooks, driven from TSX by generic reflect rows and from TypeScript by bevy_remote's method table, stepped by the frame index"

[dependencies]
raea-runtime-plugins = { path = "../../runtime/plugins" }
# a declaration's Blitz widgets, registered for every page App (declared.rs)
raea-sys-page = { path = "../../systems/page" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "default_font", "multi_threaded", "3d_bevy_render", "ui_bevy_render", "png", "tonemapping_luts", "ktx2", "zstd_rust"] }
raea-core-calls = { path = "../../core/calls" }
raea-bevy-world = { path = "../bevy-world" }
raea-bevy-calls = { path = "../bevy-calls" }
raea-bevy-adapters = { path = "../bevy-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# >>> declared dependencies: written by tools/bevy-plugins.sh sync from the projects' package.json; don't edit
bevy_aseprite_ultra = { version = "=0.10.0", optional = true, default-features = false, features = ["3d"] }
bevy_asset_loader = { version = "=0.28.1", optional = true, default-features = false, features = [] }
avian3d = { version = "=0.8.0", optional = true, default-features = false, features = ["3d", "parry-f32", "xpbd_joints", "collider-from-mesh"] }
avian2d = { version = "=0.8.0", optional = true, default-features = false, features = ["2d", "parry-f32", "default-collider", "xpbd_joints"] }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["vorbis", "ogg", "pcm", "adpcm", "alac", "aiff", "caf"] }
big_space = { version = "=0.14.0-rc.0", optional = true, default-features = false, features = ["std", "camera"] }
bevy_common_assets = { version = "=0.18.0", optional = true, default-features = false, features = ["json", "ron", "toml", "yaml", "csv", "msgpack", "xml", "postcard", "cbor"] }
bevy_console = { version = "=0.19.0", optional = true, default-features = false, features = ["default-commands"] }
bevy_egui = { version = "=0.43.1", optional = true, default-features = false, features = ["render", "default_fonts", "bevy_ui", "picking"] }
bevy_enhanced_input = { version = "=0.27.0", optional = true, default-features = false, features = ["reflect", "state", "serialize"] }
bevy_flair = { version = "=0.9.0", optional = true, default-features = false, features = ["ghost_nodes"] }
bevy_hanabi = { git = "https://github.com/djeedai/bevy_hanabi", rev = "77630ff1eed8b104f34e91d23e9440428dc5ab01", optional = true, default-features = false, features = ["3d"] }
rand_pcg = { version = "0.10", optional = true, default-features = false, features = [] }
bevy_http_client = { version = "=0.12.0", optional = true, default-features = false, features = [] }
bevy_hui = { version = "=0.8.0", optional = true, default-features = false, features = ["picking"] }
bevy-inspector-egui = { version = "=0.38.0", optional = true, default-features = false, features = ["bevy_render", "bevy_pbr", "3d", "2d", "highlight_changes"] }
bevy_kira_audio = { version = "=0.27.1", optional = true, default-features = false, features = ["ogg", "mp3", "flac", "wav"] }
leafwing-input-manager = { version = "=0.22.0", optional = true, default-features = false, features = ["asset", "mouse", "keyboard", "gamepad", "picking"] }
lightyear = { version = "=0.31.0", optional = true, default-features = false, features = ["std", "client", "server", "replication", "prediction", "crossbeam", "input_native", "raw_connection"] }
lightyear_core = { version = "=0.31.0", optional = true, default-features = false, features = ["test_utils"] }
mock_instant = { version = "0.6", optional = true, default-features = false, features = [] }
bevy_lookup_curve = { version = "=0.13.0", optional = true, default-features = false, features = ["bevy_app", "bevy_asset", "bevy_reflect", "ron", "serialize"] }
vleue_navigator = { version = "=0.17.0", optional = true, default-features = false, features = ["debug-with-gizmos"] }
noisy_bevy = { version = "=0.15.0", optional = true, default-features = false, features = ["cpu", "gpu"] }
bevy_northstar = { version = "=0.8.0", optional = true, default-features = false, features = ["parallel"] }
bevy_obj = { version = "=0.20.0", optional = true, default-features = false, features = ["mesh", "scene"] }
bevy_pancam = { version = "=0.22.0", optional = true, default-features = false, features = [] }
bevy_panorbit_camera = { version = "=0.36.0", optional = true, default-features = false, features = [] }
bevy_ghx_proc_gen = { version = "=0.10.0", optional = true, default-features = false, features = ["reflect", "default-bundle-inserters"] }
iyes_progress = { version = "=0.18.0", optional = true, default-features = false, features = [] }
bevy_quinnet = { version = "=0.22.0", optional = true, default-features = false, features = ["client", "server", "shared-client-id", "recv_channels"] }
bevy_rand = { version = "=0.16.0", optional = true, default-features = false, features = ["std", "wyrand", "bevy_reflect", "thread_local_entropy"] }
bevy_remote = { version = "=0.20.0", default-features = false }
moonshine-save = { version = "=0.8.0", optional = true, default-features = false, features = [] }
bevy_simple_tilemap = { version = "=0.21.0", optional = true, default-features = false, features = [] }
bevy_skein = { version = "=0.7.0-rc.1", optional = true, default-features = false, features = [] }
bevy_smud = { version = "=0.15.0", optional = true, default-features = false, features = [] }
bevy_sprite3d = { version = "=10.1.0", optional = true, default-features = false, features = [] }
raea-bench-swatch = { path = "../../bench/bridge/swatch", optional = true, default-features = false, features = [] }
bevy_ecs_tiled = { version = "=0.14.0", optional = true, default-features = false, features = ["render", "png", "user_properties"] }
bevy-tnua = { version = "=0.33.0", optional = true, default-features = false, features = [] }
bevy-tnua-avian3d = { version = "=0.13.0", optional = true, default-features = false, features = [] }
bevy_trauma_shake = { version = "=0.9.0", optional = true, default-features = false, features = ["events", "commands", "system_param"] }
bevy_trenchbroom = { version = "=0.15.0", optional = true, default-features = false, features = ["client"] }
bevy_tweening = { git = "https://github.com/djeedai/bevy_tweening", rev = "2341b0c3e4d18cc11825ba2d7cd6c5f6f41f4152", optional = true, default-features = false, features = ["bevy_sprite", "bevy_ui", "bevy_text"] }
bevy_vector_shapes = { version = "=0.14.0", optional = true, default-features = false, features = [] }
bevy_vox_scene = { version = "=0.23.0", optional = true, default-features = false, features = ["modify_voxels", "generate_voxels"] }
bevy-yoleck = { version = "=0.34.0", optional = true, default-features = false, features = ["vpeol_3d", "bevy_reflect"] }
# <<< declared dependencies

[features]
# >>> declared features: written by tools/bevy-plugins.sh sync; don't edit
