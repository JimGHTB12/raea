light_2d = ["raea-bevy-adapters/light_2d"]
lightyear = ["dep:lightyear", "dep:lightyear_core", "dep:mock_instant"]
lookup_curve = ["dep:bevy_lookup_curve", "raea-bevy-calls/lookup_curve"]
navigator = ["dep:vleue_navigator", "raea-bevy-calls/navigator"]
noise = ["raea-bevy-calls/noise"]
noisy = ["dep:noisy_bevy", "raea-bevy-calls/noisy"]
northstar = ["dep:bevy_northstar", "raea-bevy-calls/northstar"]
obj = ["dep:bevy_obj"]
pancam = ["dep:bevy_pancam"]
panorbit = ["dep:bevy_panorbit_camera"]
