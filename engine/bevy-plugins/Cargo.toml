rapier2d = ["raea-bevy-adapters/rapier2d"]
rapier3d = ["raea-bevy-adapters/rapier3d"]
remote = ["bevy_remote/http"]
save = ["dep:moonshine-save"]
simple_tilemap = ["dep:bevy_simple_tilemap", "raea-bevy-calls/simple_tilemap"]
skein = ["dep:bevy_skein"]
smud = ["dep:bevy_smud"]
sprite3d = ["dep:bevy_sprite3d", "raea-bevy-calls/sprite3d"]
spritesheet = ["raea-bevy-adapters/spritesheet"]
swatch = ["dep:raea-bench-swatch"]
text3d = ["raea-bevy-adapters/text3d"]
tiled = ["dep:bevy_ecs_tiled", "tilemap"]
tilemap = ["raea-bevy-adapters/tilemap"]
tnua = ["dep:bevy-tnua", "dep:bevy-tnua-avian3d", "avian"]
trauma_shake = ["dep:bevy_trauma_shake", "raea-bevy-calls/trauma_shake"]
trenchbroom = ["dep:bevy_trenchbroom"]
tween = ["raea-bevy-adapters/tween"]
