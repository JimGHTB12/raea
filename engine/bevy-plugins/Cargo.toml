# <<< declared features

# Optional dependencies a feature turns on for what they change elsewhere, not for code here: lightyear_core's
# test_utils makes lightyear read mock_instant's clock, which src/lightyear.rs steps by the frame (so render equals
# play); symphonia's vorbis, ogg, alac, aiff and caf join raea-io-media's decoders through feature unification.
[package.metadata.cargo-shear]
ignored = ["lightyear_core", "symphonia"]
