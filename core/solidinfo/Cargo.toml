[package]
name = "raea-core-solidinfo"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea solid info: a solid's parts measured (volume, area, box, centre of mass, pieces, genus), how its parts meet, an expect file's predictions checked and two mutants against them, in scene lint's found shape"

[dependencies]
raea-core-shape = { path = "../shape" }
manifold-rust = "0.16.0"
serde_json = "1"
# [x, y, z] points read as place reads them
raea-core-place = { path = "../place" }
