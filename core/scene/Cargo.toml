[package]
name = "raea-core-scene"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "A composition's 3D as data: its elements, each part placed in the world and matched across frames, their props and files"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
serde_json = "1"
# a mesh part's triangles, from its shape expression
raea-core-shape = { path = "../shape" }
