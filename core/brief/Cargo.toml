[package]
name = "raea-core-brief"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "The schemas of what an agent writes (brief, script, taste, plan), read from the JSON a .ts module evaluates to"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the TypeScript declarations are generated from these types, so the two can't drift
ts-rs = "12"
