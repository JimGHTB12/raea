[package]
name = "raea-core-review"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false
description = "raea render --review's fixed cameras from a frame's part boxes (from inside for an interior), and RAEA_CAMERA's camera in place of the scene's own"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
serde_json = "1"
raea-core-scene = { path = "../scene" }
